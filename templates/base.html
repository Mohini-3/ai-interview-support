<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title or "Interview Companion" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <header class="app-header">
    <div class="logo">Interview Companion</div>
    <nav>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('question_bank') }}">Question Bank</a>
      {% if interview %}
        <a href="{{ url_for('live_interview', interview_id=interview.id) }}">Live</a>
        <a href="{{ url_for('summary', interview_id=interview.id) }}">Summary</a>
      {% endif %}
    </nav>
  </header>

  <main class="app-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    <span>AI-Assisted Technical Interview Companion</span>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
